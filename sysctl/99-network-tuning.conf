# Network tuning for latency-sensitive, high-connection-rate workloads
# (game servers, real-time APIs, proxies) on 10G+ links.
#
# Install: copy to /etc/sysctl.d/99-network-tuning.conf, then `sysctl --system`.
# EVERY value here must be validated under YOUR load profile before production.
# Bigger buffers are not free: they add memory pressure and can add latency
# (bufferbloat) if the bottleneck is downstream.

# --- Core socket buffers -----------------------------------------------------

# Max receive/send buffer any socket may request via setsockopt(SO_RCVBUF/SNDBUF).
# 16 MiB accommodates high-BDP paths (e.g. 10 Gbit/s * 12 ms RTT ~= 15 MB).
# Raise only if you actually serve long-fat pipes; LAN-only services don't need this.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# TCP autotuning ranges: min / default / max per socket.
# Default (middle) stays modest — autotuning grows it on demand; setting the
# default high wastes memory across tens of thousands of sockets.
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# --- Backlogs and connection rates ------------------------------------------

# Per-CPU backlog of packets pulled off the NIC before the stack processes them.
# Default 1000 drops packets under bursty load (visible as softnet_stat col 2).
net.core.netdev_max_backlog = 8192

# Max queued connections for listen() — the kernel silently caps the
# application's backlog argument at this value. Default 4096 is too low for
# accept storms (deploys, reconnect stampedes after a network blip).
net.core.somaxconn = 8192

# Half-open (SYN_RECV) queue size. Paired with syncookies=1, overflow degrades
# gracefully instead of refusing connections.
net.ipv4.tcp_max_syn_backlog = 8192

# Keep syncookies on: only activates when the SYN backlog overflows,
# no cost in normal operation, saves you during SYN floods.
net.ipv4.tcp_syncookies = 1

# --- Latency-oriented TCP behavior ------------------------------------------

# Retry SYN 3 times (~7s) instead of 6 (~127s). Clients behind us fail fast
# and trigger their own retry/failover logic instead of hanging.
net.ipv4.tcp_syn_retries = 3

# Deliver data to the app on first read even if segments arrived out of order?
# No — this disables slow-start after idle. Persistent connections (gRPC, DB
# pools, game sessions) otherwise re-enter slow start after ~1 RTO idle and
# see latency spikes on the next burst.
net.ipv4.tcp_slow_start_after_idle = 0

# TFO (client+server): saves one RTT on reconnect for clients that support it.
# Value 3 = enable for both incoming and outgoing connections.
net.ipv4.tcp_fastopen = 3

# Wait at most 5s in FIN_WAIT_2 (default 60). Frees resources of half-closed
# sockets faster on servers with high connection churn.
net.ipv4.tcp_fin_timeout = 5

# Reuse TIME_WAIT sockets for new *outgoing* connections when safe by
# timestamps. Essential for proxies/clients that burn ephemeral ports.
# (Safe since it only applies to outbound; do NOT confuse with the removed
# tcp_tw_recycle, which broke NAT'd clients.)
net.ipv4.tcp_tw_reuse = 1

# Widen the ephemeral port range for outbound-heavy boxes (proxies, sidecars).
net.ipv4.ip_local_port_range = 10240 65535

# --- Congestion control and queueing ----------------------------------------

# BBR keeps queues short (models bandwidth+RTT instead of filling buffers),
# which is what you want for latency; requires the tcp_bbr module.
# Validate against cubic for your traffic — BBRv1 can be unfair on some paths.
net.ipv4.tcp_congestion_control = bbr

# fq pairs with BBR (pacing) and reduces intra-host bufferbloat.
net.core.default_qdisc = fq

# --- Keepalive: detect dead peers in ~1 min instead of ~2h ------------------

# Only affects sockets that enable SO_KEEPALIVE.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# --- Conntrack (only relevant if netfilter/conntrack is loaded) -------------

# Default table size overflows on busy NAT/ingress nodes; when it overflows
# the kernel DROPS new connections ("nf_conntrack: table full").
# Each entry ~320 bytes: 1M entries ~= 320 MB. Size to your peak flows.
net.netfilter.nf_conntrack_max = 1048576

# Shorten established-flow tracking from 5 days to 1 hour — long defaults
# keep dead flows in the table and inflate its occupancy.
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
