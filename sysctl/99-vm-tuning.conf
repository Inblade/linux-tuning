# Virtual memory tuning for latency-sensitive workloads.
#
# Install: copy to /etc/sysctl.d/99-vm-tuning.conf, then `sysctl --system`.
# These values trade throughput and memory utilization for predictable
# latency. Load-test before production — especially the dirty ratios,
# which interact with your storage speed.

# --- Swap ---------------------------------------------------------------------

# Strongly prefer dropping page cache over swapping anonymous memory.
# swappiness=1 (not 0): 0 disables swap of anon pages entirely until OOM,
# 1 keeps it as a last resort. A latency-sensitive process that gets swapped
# out pays milliseconds-to-seconds on wakeup.
vm.swappiness = 1

# --- Dirty page writeback -----------------------------------------------------

# Absolute-byte thresholds instead of percentage (*_ratio); on a 256 GB box,
# the default 20% dirty ratio allows ~51 GB of dirty pages — flushing that
# causes multi-second stalls where writes block in write().
#
# background: kernel flusher threads start writing back asynchronously.
# hard limit: writers are throttled/blocked synchronously — keep the gap wide
# so normal load never hits the hard limit.
# Sized for NVMe (~GB/s flush); scale down for slower storage.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824

# Start writeback of pages dirty for >10s (default 30s) — smaller, more
# frequent flushes instead of large periodic ones.
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 500

# --- Memory reclaim -----------------------------------------------------------

# Keep a larger free-memory reserve so bursts allocate from free pages instead
# of triggering direct reclaim (which stalls the allocating thread).
# 1 GB on large-memory hosts; do not oversize — this memory is unusable.
vm.min_free_kbytes = 1048576

# Don't reclaim directory/inode caches more aggressively than page cache.
# Default 100 is fine; lower (e.g. 50) if the workload re-stats many files.
vm.vfs_cache_pressure = 100

# --- Overcommit / OOM ---------------------------------------------------------

# Heuristic overcommit (default). Do NOT set 2 (strict) on general hosts —
# fork-heavy services start failing allocations long before memory is
# actually exhausted.
vm.overcommit_memory = 0

# Panic-free OOM: let the OOM killer pick a victim rather than panicking the
# host. Combined with systemd OOMPolicy / cgroup limits per service.
vm.panic_on_oom = 0

# --- Huge pages ---------------------------------------------------------------

# Transparent Huge Pages: 'madvise' gives THP only to applications that ask
# (databases like PostgreSQL recommend disabling THP entirely; JVMs benefit
# from madvise). 'always' causes khugepaged compaction stalls under
# fragmentation — a classic source of multi-ms latency spikes.
# THP mode is not a sysctl — set via kernel cmdline or:
#   echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
# Kept here as documentation; tune-check.sh verifies it.

# Reduce NUMA balancing scanning overhead on pinned workloads; if you pin
# memory+CPU explicitly (see docs/numa.md), automatic balancing only adds
# page faults.
kernel.numa_balancing = 0

# --- Scheduler ---------------------------------------------------------------

# Do not group tasks by TTY session for scheduling (server, not desktop).
kernel.sched_autogroup_enabled = 0
